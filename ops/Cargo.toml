[package]
name = "ops"    # ブックの操作の言葉(Book/Range)。gpui を知らない(SEKKEI「操作の言葉を1本に」段A)
version = "0.0.1"
edition.workspace = true
license.workspace = true

# sheet と kumihan(エンジンの層)だけ。「動いているアプリ」の都合
# (undo の節目・状態行・画面)は Host trait の向こう側 — 実装が calc なら
# 生きた表、pysheet ならファイル。gpui は絶対に入れない
[dependencies]
sheet = { path = "../sheet" }
# 設定の置き場は pyrun が正本(2026-08-16)。依存ゼロの std だけの機構
pyrun = { path = "../pyrun" }
kumihan = { path = "../engine" }
# 署名の鍵(calc と writer が同じ鍵を使う)
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
# 鍵の種にする OS の乱数。**Windows に /dev/urandom は無い**(2026-08-17、
# calc/writer を Windows の的に足して分かった)。鍵は安全に関わる値なので、
# 時刻や pid で誤魔化さずに OS の口を使う。gpui が既に引いている小さな crate
getrandom = "0.3"
