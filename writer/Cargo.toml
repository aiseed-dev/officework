[package]
name = "writer"     # docx互換のワープロ。calc とは別のソフト
version = "0.1.0-alpha"
edition.workspace = true
license.workspace = true

# Windows の .exe に絵を焼くためだけ(build.rs)。
# **他の的では何もしない** — Linux と macOS の組み立てには触らない
[build-dependencies]
winresource = "0.1"

[lib]
name = "writer"
path = "src/lib.rs"

[[bin]]
name = "writer"
path = "src/main.rs"

[dependencies]
# HTML の https(公開 Web も見える — 発注者 2026-08-04)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# HTML の文字コード(CP932 の実物を読むため)
encoding_rs = "0.8"
# デジタル署名(隣の .sig への添え書き。Ed25519)
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
kumihan = { path = "../engine" }
book = { path = "../book" }
ui = { path = "../ui" }
pyrun = { path = "../pyrun" }
ops = { path = "../ops" }
# エージェント(agent.ja.adoc の段10。2026-09-04)。表計算と同じ物を使います
agent = { path = "../agent" }
face = { path = "../face" }
lang = { path = "../lang" }
ooxml = { path = "../ooxml" }
paper = { path = "../paper" }
# GPUI は crates.io に無いので、版を固定して zed から直に取る
gpui = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23", features = ["wayland", "x11"] }
rfd = "0.14"
# 壊れた docx から字を拾う(復旧)。試験でも書き出した部品を直に見る
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# ボタンを全部おす試験のため(GUI は起こさない)
gpui = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23", features = ["test-support"] }
