[package]
name = "sheet"      # C0: xlsx の読み書きと表計算の核。UI非依存
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "SpreadsheetML(xlsx)の読み書きと式の再計算。マクロは実装しない(設計判断)"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
# adoc の表の読み書きは engine に1つあるので、二重に書かない
# (docs/sekkei/calc.ja.adoc「置き場」2026-08-18 発注者)。輪にはならない
# — kumihan は sheet を知らない
kumihan = { path = "../engine" }
