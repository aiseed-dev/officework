# nginx site for office.aiseed.dev. Flet serves the page on 127.0.0.1:8550
# and talks over a WebSocket, so Upgrade and Connection are passed through.
# TLS: run certbot --nginx after the server block is in place.
server {
    listen 80;
    listen [::]:80;
    server_name office.aiseed.dev;

    location / {
        proxy_pass http://127.0.0.1:8550;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
