[package]
name = "calc"       # xlsx互換の表計算。writer とは別のソフト
version = "0.1.0-alpha"
edition.workspace = true
license.workspace = true

# Windows の .exe に絵を焼くためだけ(build.rs)。
# **他の的では何もしない** — Linux と macOS の組み立てには触らない
[build-dependencies]
winresource = "0.1"

[lib]
name = "calc"
path = "src/lib.rs"

[[bin]]
name = "calc"
path = "src/main.rs"

[dependencies]
book = { path = "../book" }
pivot = { path = "../pivot" }
sheet = { path = "../sheet" }
pyrun = { path = "../pyrun" }
ops = { path = "../ops" }
# CSV を Shift_JIS でも書けるように(日本の会計ソフトはまだ CP932)
encoding_rs = "0.8"

paper = { path = "../paper", features = ["e"] }
# 暗号化(ECMA-376 Standard)は writer と同じ ooxml::crypt を使う
ooxml = { path = "../ooxml" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
kumihan = { path = "../engine" }
ui = { path = "../ui" }
# 絵を描かない物(関数の表・リボンの表・キー)。gpui を持たない
face = { path = "../face" }
# GPUI は crates.io に無いので、版を固定して zed から直に取る
gpui = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23", features = ["wayland", "x11"] }
rfd = "0.14"

[dev-dependencies]
# 釦を全部おす試験のため(GUI は起こさない)— writer と同じ作法
gpui = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23", features = ["test-support"] }
