# アプリ(calc / writer)を包んで Releases に置く。
#
# 出し方: `app-v0.1.0-alpha` のようなタグを押す。手で回すこともできる
# (Actions の画面から。draft を外さなければ下書きのまま置かれる)。
#
# **エンジンの版とは別に数える**(発注者 2026-08-14)。エンジンは PyPI の
# officework(いま 0.3.0)、アプリはこれが初回で 0.1.0-alpha。だから
# タグの頭を `app-v` にして、publish-pypi.yml の `v*` と取り違えないようにする。
#
# **Python を同梱する。** 機械に Python が入っていなくてもマクロが動く
# (Windows は入っていないのが普通)。中身は python-build-standalone
# (astral-sh・PSF ライセンスで再配布できる)の 3.14 系。
name: release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "下書きのまま置く(公開しない)"
        type: boolean
        default: true

permissions:
  contents: write   # Releases に置くのに要る

env:
  PY_VER: "3.14.6"
  PY_TAG: "20260610"

jobs:
  linux:
    name: Linux(tar.gz と .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPUI が繋ぐ物を入れる
        # 中身は ci.yml の apps の仕事と同じ顔ぶれ(あちらで実測した物)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev cmake clang pkg-config
      - name: 包む
        run: packaging/make-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb

  macos:
    name: macOS(.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 組む
        run: cargo build --release -p calc -p writer
      - name: 包む(.app に Python まで入れる)
        # **署名の前に中身を全部そろえる。** 後から1つでも足すと署名が壊れる
        # (同梱 Python と pip で入れた物も、全部が署名の対象)
        run: |
          VER=$(grep -m1 '^version' calc/Cargo.toml | cut -d'"' -f2)
          PY_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-${PY_VER}%2B${PY_TAG}-aarch64-apple-darwin-install_only_stripped.tar.gz"
          for app in calc writer; do
            APP="dist/officework $app.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "target/release/$app" "$APP/Contents/MacOS/"
            # **絵を持たせる。** 無いと Finder でも Dock でも無地になる
            # (2026-08-17 のアルファの棚卸しまでそうだった)。
            # .icns は tools/make_icons.py が SVG から起こしてコミットしてある
            cp "packaging/icons/officework-$app.icns" "$APP/Contents/Resources/"
            cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>officework $app</string>
            <key>CFBundleExecutable</key><string>$app</string>
            <key>CFBundleIdentifier</key><string>io.github.aiseed-dev.officework.$app</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>officework-$app.icns</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          done
          # Python は calc の中に1つだけ置き、writer からも見えるようにする
          curl -fsSL -o py.tar.gz "$PY_URL"
          tar xzf py.tar.gz -C "dist/officework calc.app/Contents/MacOS"
          "dist/officework calc.app/Contents/MacOS/python/bin/python3" -m pip install --quiet officework || true
          cp -r sample/plugins dist/
          cp packaging/README.ja.md dist/はじめに.md
          echo "VER=$VER" >> "$GITHUB_ENV"

      # ---- ここから署名と公証(docs/mac-signing.ja.md)------------------------
      #
      # **順番に意味がある。** 中の Mach-O → .app → .app を公証して券を貼る
      # → .dmg を作る → .dmg を署名 → .dmg を公証して券を貼る。
      # .app にも券を貼るのは、利用者が .dmg から出した後に**繋がっていなくても**
      # 開けるようにするため(貼っていないと初回に問い合わせが要る)。
      - name: 鍵を入れる
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: packaging/macos/sign.sh keychain
      - name: .app を署名する(中から外へ)
        run: |
          for app in dist/*.app; do
            packaging/macos/sign.sh app "$app"
          done
      - name: .app を公証して券を貼る
        env:
          MAC_API_KEY_P8: ${{ secrets.MAC_API_KEY_P8 }}
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER_ID: ${{ secrets.MAC_API_ISSUER_ID }}
        run: |
          # 公証は1つずつ出すより、まとめて zip にして1回で出すほうが速い
          ditto -c -k --keepParent --sequesterRsrc dist apps.zip
          packaging/macos/sign.sh notarize apps.zip
          for app in dist/*.app; do xcrun stapler staple "$app"; done
          rm -f apps.zip
      - name: .dmg を作って、署名・公証・券貼り
        env:
          MAC_API_KEY_P8: ${{ secrets.MAC_API_KEY_P8 }}
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER_ID: ${{ secrets.MAC_API_ISSUER_ID }}
        run: |
          DMG="officework-$VER-macos-arm64.dmg"
          hdiutil create -volname "officework $VER" -srcfolder dist -ov -format UDZO "$DMG"
          packaging/macos/sign.sh dmg "$DMG"
          packaging/macos/sign.sh notarize "$DMG"
      - name: 利用者と同じ目で確かめる
        # **ここが実機の代わり。** spctl は Gatekeeper そのものなので、
        # 通れば「初回は右クリック→開く」は要らない。落ちたら出さない
        run: packaging/macos/sign.sh verify "officework-$VER-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.dmg"

  windows:
    name: Windows(zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 組む
        # 2026-08-17 から **ci.yml の apps でも Windows を組んでいる**ので、
        # ここはもう初見ではない(それまでは「タグを押して初めて試される」
        # 状態だった — アルファの棚卸しで見つけて的に足した)
        run: cargo build --release -p calc -p writer
      - name: 包む
        # .msi はこれから(WiX の工事)。まず zip で試せる形にする
        shell: bash
        run: |
          VER=$(grep -m1 '^version' calc/Cargo.toml | cut -d'"' -f2)
          D="officework-$VER-windows-x86_64"
          mkdir -p "$D"
          cp target/release/calc.exe target/release/writer.exe "$D/"
          curl -fsSL -o py.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-${PY_VER}%2B${PY_TAG}-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          tar xzf py.tar.gz -C "$D"
          "$D/python/python.exe" -m pip install --quiet officework || true
          cp -r sample/plugins "$D/"
          cp packaging/README.ja.md "$D/はじめに.md"
          # 絵も入れる。**.exe 自身にはまだ焼き込んでいない**(build.rs で
          # 資源として埋める工事が要る)ので、いまは近道を作る人が
          # 使えるように同梱するだけ — 出来ないことを出来るように見せない
          cp packaging/icons/officework-calc.ico packaging/icons/officework-writer.ico "$D/"
          7z a "$D.zip" "$D" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    name: Releases に置く
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 置く
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: ${{ inputs.draft != false }}
          generate_release_notes: true
          body: |
            ## officework — アルファ版

            **表計算と文書。Python でマクロが書けます。**

            `.py` を `~/.config/officework/funcs/`(Windows は
            `%USERPROFILE%\.config\officework\funcs\`)に置くと、セルから
            日本語の関数として呼べます。

            ```python
            def 税込(x):
                return round(float(x) * 1.1)
            ```

            → セルに `=税込(1000)` で **1100**。

            **Python は同梱しています**(3.14。機械に入っていなくても動きます)。
            ブックはコードを運ばないので「開く=実行」がありません。

            ### 落とす物

            | 機械 | ファイル |
            |---|---|
            | Linux | `.deb`(入れる)か `.tar.gz`(展開するだけ) |
            | macOS | `.dmg` — 署名と公証つき。そのまま開けます |
            | Windows | `.zip` — 展開して `calc.exe`。**署名はまだ**(SmartScreen が出ます) |

            試し方と、動かないときの手当ては同梱の「はじめに」を見てください。

            ### アルファです

            見つかった不具合は
            [Issues](https://github.com/aiseed-dev/officework/issues) へ。
            エンジン(Python から使う `officework` パッケージ)は別に
            [PyPI](https://pypi.org/project/officework/) で配っています。
