# アプリ(calc / writer)を包んで Releases に置く。
#
# 出し方: `app-v0.1.0-alpha` のようなタグを押す。手で回すこともできる
# (Actions の画面から。draft を外さなければ下書きのまま置かれる)。
#
# **エンジンの版とは別に数える**(発注者 2026-08-14)。エンジンは PyPI の
# officework(いま 0.3.0)、アプリはこれが初回で 0.1.0-alpha。だから
# タグの頭を `app-v` にして、publish-pypi.yml の `v*` と取り違えないようにする。
#
# **Python を同梱する。** 機械に Python が入っていなくてもマクロが動く
# (Windows は入っていないのが普通)。中身は python-build-standalone
# (astral-sh・PSF ライセンスで再配布できる)の 3.14 系。
name: release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "下書きのまま置く(公開しない)"
        type: boolean
        default: true
      mac_only:
        # **試すときの近道。** mac の署名を確かめたいだけなら、Linux と
        # Windows を組む意味が無い(そのぶん20分ほど短くなる)。
        # Releases に置く段も飛ばすので、出来た .dmg は走行ページの
        # Artifacts から落とす
        description: "macOS だけ組む(署名を試すとき)"
        type: boolean
        default: false

permissions:
  contents: write   # Releases に置くのに要る

env:
  PY_VER: "3.14.6"
  PY_TAG: "20260610"

jobs:
  linux:
    name: Linux(tar.gz と .deb)
    if: ${{ !inputs.mac_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # **失敗した回でも組んだ物を残す。** 既定では job が失敗すると
          # 保存しないので、組み立ての後ろの段で落ちるたびに、次の回も
          # 一から組み直しになる(2026-08-17、Windows が 12分14秒かけて
          # 組んだ後に put-bins.py の1行で落ち、その結果が捨てられた)
          cache-on-failure: "true"
      - name: GPUI が繋ぐ物を入れる
        # 中身は ci.yml の apps の仕事と同じ顔ぶれ(あちらで実測した物)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev cmake clang pkg-config
      - name: 包む
        run: packaging/make-linux.sh
      - name: 入れて確かめる(.deb を入れ、消す)
        # Windows と同じ理由で、**入るところまで機械にやらせる**。
        # 置かれた物・デスクトップの項目・アイコンを見て、消えることも見る
        run: |
          sudo dpkg -i packaging/out/officework_*_amd64.deb
          for f in /opt/officework/calc /opt/officework/writer \
                   /usr/share/applications/officework-calc.desktop \
                   /usr/share/icons/hicolor/48x48/apps/officework-calc.png; do
            [ -e "$f" ] || { echo "入っていません: $f"; exit 1; }
            echo "  入った: $f"
          done
          # デスクトップの項目が壊れていないか(desktop-file-validate があれば)
          if command -v desktop-file-validate > /dev/null; then
            desktop-file-validate /usr/share/applications/officework-calc.desktop
            echo "  デスクトップの項目は正しい形です"
          fi
          sudo dpkg -r officework
          [ -e /opt/officework/calc ] && { echo "消えていません"; exit 1; }
          echo "  消えました"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb

  macos:
    name: macOS(.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # **失敗した回でも組んだ物を残す。** 既定では job が失敗すると
          # 保存しないので、組み立ての後ろの段で落ちるたびに、次の回も
          # 一から組み直しになる(2026-08-17、Windows が 12分14秒かけて
          # 組んだ後に put-bins.py の1行で落ち、その結果が捨てられた)
          cache-on-failure: "true"
      - name: 組んで・包んで・署名する
        # **手元の Mac と同じ台本を回す**(packaging/make-macos.sh)。
        # 前はここに同じ手順が二重に書いてあった — 直す所が2箇所あると、
        # 必ず片方が古くなる。
        #
        # 署名の秘密が無ければ**署名せずに包む**。その .dmg は名前に
        # `-unsigned` が付くので、取り違えて「署名つき」と言って配ることは
        # 起きない(発注者が手元の Mac で署名する道もあるため、
        # ここで落とさない — docs/mac-signing.ja.md)
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_API_KEY_P8: ${{ secrets.MAC_API_KEY_P8 }}
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER_ID: ${{ secrets.MAC_API_ISSUER_ID }}
          # 鍵束に Developer ID Application が2枚以上あるときだけ要る
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            packaging/make-macos.sh
          else
            echo "::warning::mac の署名の秘密がありません — 署名せずに包みます(名前に -unsigned が付きます)"
            packaging/make-macos.sh --no-sign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "packaging/out/*.dmg"

  windows:
    name: Windows(setup.exe)
    if: ${{ !inputs.mac_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # **失敗した回でも組んだ物を残す。** 既定では job が失敗すると
          # 保存しないので、組み立ての後ろの段で落ちるたびに、次の回も
          # 一から組み直しになる(2026-08-17、Windows が 12分14秒かけて
          # 組んだ後に put-bins.py の1行で落ち、その結果が捨てられた)
          cache-on-failure: "true"
      - name: 組む
        # 2026-08-17 から **ci.yml の apps でも Windows を組んでいる**ので、
        # ここはもう初見ではない(それまでは「タグを押して初めて試される」
        # 状態だった — アルファの棚卸しで見つけて的に足した)。
        # .exe への絵の焼き込みは build.rs(winresource)がやる
        run: cargo build --release -p calc -p writer
      - name: 中身をそろえる
        shell: bash
        run: |
          VER=$(grep -m1 '^version' calc/Cargo.toml | cut -d'"' -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          D="packaging/out/windows"
          mkdir -p "$D"
          cp target/release/calc.exe target/release/writer.exe "$D/"
          curl -fsSL -o py.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-${PY_VER}%2B${PY_TAG}-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          tar xzf py.tar.gz -C "$D"
          "$D/python/python.exe" -m pip install --quiet officework || true
          cp -r sample/plugins "$D/"
          cp packaging/README.ja.md "$D/はじめに.md"
      - name: 入れ物を作る(Inno Setup)
        # **zip をやめた**(発注者 2026-08-17)。スタートメニュー・
        # アンインストール・関連付けが zip では作れない。
        # 管理者権限は求めない作りなので、会社の PC でも試せる。
        # windows-latest には Inno Setup が入っている(無ければ choco で入れる)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DVersion=$env:VER" "/DSrc=..\out\windows" packaging\windows\officework.iss
      - name: 入れて確かめる(黙って入れ、消す)
        # **「組めた」で終わらせない。** 手元に Windows が無く、試せる人も
        # いないので(2026-08-17 発注者)、機械にできることは機械にやらせる。
        #
        # 黙って入れる → 置かれた物とスタートメニューを見る → 黙って消す →
        # 消えたことを見る。ここまでは人がいなくても確かめられる。
        #
        # **窓が開くかどうかは別**。GPUI が画面を出せるかは、この機械では
        # 当てにならないので、試して結果を書き出すだけにして落とさない
        shell: pwsh
        run: |
          $setup = Get-ChildItem packaging/out/*setup.exe | Select-Object -First 1
          Write-Host "入れます: $($setup.Name)"
          Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          $app = "$env:LOCALAPPDATA\Programs\officework"
          foreach ($f in @("calc.exe", "writer.exe", "python\python.exe")) {
            if (-not (Test-Path "$app\$f")) { throw "入っていません: $f" }
            $mb = [math]::Round((Get-Item "$app\$f").Length / 1MB, 1)
            Write-Host "  入った: $f ($mb MB)"
          }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\officework"
          if (-not (Test-Path "$menu\officework calc.lnk")) {
            throw "スタートメニューに出ていません"
          }
          Write-Host "  スタートメニューに出ました"

          # 窓が開くかは当てにならないので、結果を書き出すだけ
          try {
            $p = Start-Process "$app\calc.exe" -PassThru
            Start-Sleep -Seconds 8
            if ($p.HasExited) {
              Write-Host "起動: すぐ終了しました(終了コード $($p.ExitCode))"
            } else {
              Write-Host "起動: 8秒たっても動いています"
              Stop-Process -Id $p.Id -Force
            }
          } catch {
            Write-Host "起動: 試せませんでした($_)"
          }

          # 消えるかも見る
          $un = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$app\calc.exe") { throw "消えていません" }
          Write-Host "  消えました"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "packaging/out/*setup.exe"

  release:
    name: Releases に置く
    if: ${{ !inputs.mac_only }}
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 名前と中身を決める
        # **タグを明に決める。** 手で回したとき(workflow_dispatch)の
        # `github.ref` は枝なので、任せると **`main` という名前の Release**
        # が出来る(2026-08-17 に実際に出来た)。タグから来たときはその名前、
        # 手で回したときは版から `app-v…` を組む。
        #
        # あわせて **署名なしの物が混ざっていたら下書きに落とす** —
        # 説明文は「署名と公証つき」と言うので、そのまま公開すると嘘になる
        id: meta
        run: |
          VER=$(grep -m1 '^version' calc/Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=app-v$VER" >> "$GITHUB_OUTPUT"
          fi
          if ls dist/**/*-unsigned* > /dev/null 2>&1; then
            echo "::warning::署名なしの物が混ざっています — 下書きのままにします"
            echo "unsigned=1" >> "$GITHUB_OUTPUT"
          else
            echo "unsigned=0" >> "$GITHUB_OUTPUT"
          fi
      - name: 置く
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/**/*
          draft: ${{ inputs.draft != false || steps.meta.outputs.unsigned == '1' }}
          generate_release_notes: true
          body: |
            ## officework — アルファ版

            **表計算と文書。Python でマクロが書けます。**

            `.py` を `~/.config/officework/funcs/`(Windows は
            `%USERPROFILE%\.config\officework\funcs\`)に置くと、セルから
            日本語の関数として呼べます。

            ```python
            def 税込(x):
                return round(float(x) * 1.1)
            ```

            → セルに `=税込(1000)` で **1100**。

            **Python は同梱しています**(3.14。機械に入っていなくても動きます)。
            ブックはコードを運ばないので「開く=実行」がありません。

            ### 落とす物

            | 機械 | ファイル |
            |---|---|
            | Linux | `.deb`(入れる)か `.tar.gz`(展開するだけ) |
            | macOS | `.dmg` — 署名と公証つき。そのまま開けます(名前に `-unsigned` と付く物は署名前です) |
            | Windows | `setup.exe` — 入れるとスタートメニューに出ます。**管理者権限は要りません** |

            > **Windows は「WindowsによってPCが保護されました」が出ます。**
            > まだ署名していないためです(**詳細情報 → 実行**で入ります)。
            > 落ち着いたら Microsoft ストアから出す予定です。

            試し方と、動かないときの手当ては同梱の「はじめに」を見てください。

            ### どこまで確かめてあるか

            Linux と Windows は、**機械が実際に入れて、置かれた物を見て、
            消えることまで**確かめています。macOS は署名と公証が
            Gatekeeper の検査(`spctl`)を通ることを確かめています。

            ただし **Windows で窓が開くところは人の目で見ていません**。
            開かない・おかしいときは
            [Issues](https://github.com/aiseed-dev/officework/issues) に
            書いてもらえると助かります。

            ### アルファです

            見つかった不具合は
            [Issues](https://github.com/aiseed-dev/officework/issues) へ。
            エンジン(Python から使う `officework` パッケージ)は別に
            [PyPI](https://pypi.org/project/officework/) で配っています。
