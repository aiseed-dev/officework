# アプリ(calc / writer)を包んで Releases に置く。
#
# 出し方: `app-v0.1.0-alpha` のようなタグを押す。手で回すこともできる
# (Actions の画面から。draft を外さなければ下書きのまま置かれる)。
#
# **エンジンの版とは別に数える**(発注者 2026-08-14)。エンジンは PyPI の
# officework(いま 0.3.0)、アプリはこれが初回で 0.1.0-alpha。だから
# タグの頭を `app-v` にして、publish-pypi.yml の `v*` と取り違えないようにする。
#
# **Python を同梱する。** 機械に Python が入っていなくてもマクロが動く
# (Windows は入っていないのが普通)。中身は python-build-standalone
# (astral-sh・PSF ライセンスで再配布できる)の 3.14 系。
name: release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "下書きのまま置く(公開しない)"
        type: boolean
        default: true

permissions:
  contents: write   # Releases に置くのに要る

env:
  PY_VER: "3.14.6"
  PY_TAG: "20260610"

jobs:
  linux:
    name: Linux(tar.gz と .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPUI が繋ぐ物を入れる
        # 中身は ci.yml の apps の仕事と同じ顔ぶれ(あちらで実測した物)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev cmake clang pkg-config
      - name: 包む
        run: packaging/make-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb

  macos:
    name: macOS(.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 組んで・包んで・署名する
        # **手元の Mac と同じ台本を回す**(packaging/make-macos.sh)。
        # 前はここに同じ手順が二重に書いてあった — 直す所が2箇所あると、
        # 必ず片方が古くなる。
        #
        # 署名の秘密が無ければ**署名せずに包む**。その .dmg は名前に
        # `-unsigned` が付くので、取り違えて「署名つき」と言って配ることは
        # 起きない(発注者が手元の Mac で署名する道もあるため、
        # ここで落とさない — docs/mac-signing.ja.md)
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_API_KEY_P8: ${{ secrets.MAC_API_KEY_P8 }}
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER_ID: ${{ secrets.MAC_API_ISSUER_ID }}
          # 鍵束に Developer ID Application が2枚以上あるときだけ要る
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            packaging/make-macos.sh
          else
            echo "::warning::mac の署名の秘密がありません — 署名せずに包みます(名前に -unsigned が付きます)"
            packaging/make-macos.sh --no-sign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "packaging/out/*.dmg"

  windows:
    name: Windows(zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 組む
        # 2026-08-17 から **ci.yml の apps でも Windows を組んでいる**ので、
        # ここはもう初見ではない(それまでは「タグを押して初めて試される」
        # 状態だった — アルファの棚卸しで見つけて的に足した)
        run: cargo build --release -p calc -p writer
      - name: 包む
        # .msi はこれから(WiX の工事)。まず zip で試せる形にする
        shell: bash
        run: |
          VER=$(grep -m1 '^version' calc/Cargo.toml | cut -d'"' -f2)
          D="officework-$VER-windows-x86_64"
          mkdir -p "$D"
          cp target/release/calc.exe target/release/writer.exe "$D/"
          curl -fsSL -o py.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-${PY_VER}%2B${PY_TAG}-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          tar xzf py.tar.gz -C "$D"
          "$D/python/python.exe" -m pip install --quiet officework || true
          cp -r sample/plugins "$D/"
          cp packaging/README.ja.md "$D/はじめに.md"
          # 絵も入れる。**.exe 自身にはまだ焼き込んでいない**(build.rs で
          # 資源として埋める工事が要る)ので、いまは近道を作る人が
          # 使えるように同梱するだけ — 出来ないことを出来るように見せない
          cp packaging/icons/officework-calc.ico packaging/icons/officework-writer.ico "$D/"
          7z a "$D.zip" "$D" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    name: Releases に置く
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 置く
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: ${{ inputs.draft != false }}
          generate_release_notes: true
          body: |
            ## officework — アルファ版

            **表計算と文書。Python でマクロが書けます。**

            `.py` を `~/.config/officework/funcs/`(Windows は
            `%USERPROFILE%\.config\officework\funcs\`)に置くと、セルから
            日本語の関数として呼べます。

            ```python
            def 税込(x):
                return round(float(x) * 1.1)
            ```

            → セルに `=税込(1000)` で **1100**。

            **Python は同梱しています**(3.14。機械に入っていなくても動きます)。
            ブックはコードを運ばないので「開く=実行」がありません。

            ### 落とす物

            | 機械 | ファイル |
            |---|---|
            | Linux | `.deb`(入れる)か `.tar.gz`(展開するだけ) |
            | macOS | `.dmg` — 署名と公証つき。そのまま開けます(名前に `-unsigned` と付く物は署名前です) |
            | Windows | `.zip` — 展開して `calc.exe`。**署名はまだ**(SmartScreen が出ます) |

            試し方と、動かないときの手当ては同梱の「はじめに」を見てください。

            ### アルファです

            見つかった不具合は
            [Issues](https://github.com/aiseed-dev/officework/issues) へ。
            エンジン(Python から使う `officework` パッケージ)は別に
            [PyPI](https://pypi.org/project/officework/) で配っています。
