# officework(エンジン)を PyPI へ出す。
#
# **PyPI の Trusted Publisher(OIDC)で出す** — API トークンを持たない。
# PyPI 側に登録する値:
#   PyPI Project Name : officework
#   Owner             : aiseed-dev
#   Repository name   : officework
#   Workflow name     : publish-pypi.yml
#   Environment name  : pypi
#
# 出し方: `v0.1.0` のような版のタグを押す。手で回すこともできる
# (Actions の画面から。dry_run を付けると PyPI へは上げず wheel だけ作る)。
name: publish-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "PyPI へ上げずに wheel を作るだけ"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # 各プラットフォームの wheel。abi3-py310 なので **1枚で 3.10 以降を賄う**
  wheels:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --release --out dist
          - os: macos-latest
            args: --release --out dist --target universal2-apple-darwin
          - os: windows-latest
            args: --release --out dist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 画面を組むのに要る物(Linux だけ)
        # 組み上がったバイナリの ldd から起こした一覧(ci.yml と同じ)。
        # libfontconfig1-dev は ldd に出ないが、組むときに要る
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev cmake clang pkg-config
      - name: アプリを組む(calc / writer)
        # **wheel にアプリも入れる**(発注者 2026-08-17「画面も動くようにして」)。
        # pip で入れた物には mac の quarantine も Windows の Mark of the Web も
        # 付かないので、**署名が要らない配り方**になる。
        #
        # mac は wheel が universal2 なので、アプリも両方の的で組んで lipo で
        # 1つにする。**この横断の組み立ては一度も走っていない** — ここが
        # 落ちたら、mac だけ的ごとの wheel に分ける
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release -p calc -p writer --target aarch64-apple-darwin
            cargo build --release -p calc -p writer --target x86_64-apple-darwin
            mkdir -p target/release
            for a in calc writer; do
              lipo -create -output "target/release/$a" \
                "target/aarch64-apple-darwin/release/$a" \
                "target/x86_64-apple-darwin/release/$a"
            done
          else
            cargo build --release -p calc -p writer
          fi
          python3 packaging/put-bins.py
      - name: wheel を組む
        uses: PyO3/maturin-action@v1
        with:
          working-directory: pysheet
          args: ${{ matrix.args }}
          # Linux は古い glibc でも動くように manylinux の中で組む
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
          # **毎回まっさらから組み直さない。** Windows は NTFS とリンクが
          # 重く、他の2つより目に見えて遅い(2026-08-09 発注者指摘)。
          # sccache は manylinux の入れ物の中でも効く
          sccache: "true"
      - name: まっさらな環境で確かめる
        # **組めただけで良しとしない** — 入れて import して、実物の xlsx を
        # 往復させる。ここが通らないものは出さない
        shell: bash
        env:
          # Windows の既定の標準出力は cp1252 で、日本語を print すると
          # そこだけで落ちる(2026-08-09 に踏んだ。**中身は通っていた** —
          # セルの往復は成功していて、最後の print だけが死んでいた)
          PYTHONIOENCODING: utf-8
        run: |
          # **径路は書き下さない** — Windows に /tmp は無い(2026-08-09 に踏んだ)。
          # 仮想環境は作業場所の下に作り、書き先は tempfile に決めさせる
          python -m venv kensho-venv
          PY=kensho-venv/bin/python
          [ -f "$PY" ] || PY=kensho-venv/Scripts/python
          "$PY" -m pip install --quiet --find-links pysheet/dist officework
          "$PY" - <<'PYEOF'
          import os, tempfile
          from officework import sheet
          out = os.path.join(tempfile.mkdtemp(), "kensho.xlsx")
          b = sheet.Book.open("templates/在庫台帳.xlsx")
          s = b[0]
          assert s.shape[0] > 0, "行が読めていない"
          s["A1"] = "検査"
          b.save(out)
          assert sheet.Book.open(out)[0]["A1"] == "検査"
          print("往復できた:", b.sheet_names)
          PYEOF
          # **画面も入っているか。** 起こすと窓が開いてしまうので、
          # 実行ファイルが在って動くことだけ見る(--version は窓を開かない)
          BIN=kensho-venv/bin/officework-calc
          [ -f "$BIN" ] || BIN=kensho-venv/Scripts/officework-calc.exe
          [ -f "$BIN" ] || { echo "officework-calc が入っていません"; exit 1; }
          "$PY" - <<'PYEOF'
          import pathlib, sys, officework
          # **同梱された場所だけを見る。** app._exe() は見つからなければ
          # 手元のリポジトリの target/release も探すので、CI では
          # wheel に入っていなくても通ってしまう(偽の合格)
          bin_dir = pathlib.Path(officework.__file__).parent / "bin"
          for a in ("calc", "writer"):
              exe = bin_dir / (a + (".exe" if sys.platform == "win32" else ""))
              assert exe.exists(), f"wheel に {a} が入っていません: {exe}"
              size = exe.stat().st_size
              assert size > 5_000_000, f"{a} が小さすぎます({size} バイト)"
              print(f"画面も入っている: {a} {size/1e6:.0f}MB")
          PYEOF
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: pysheet/dist

  # 元の形(sdist)。conda-forge はこちらを見る
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: pysheet
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: pysheet/dist

  publish:
    needs: [wheels, sdist]
    # タグを押したときだけ。手回しのときは dry_run を外したときだけ
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publisher(OIDC)に要る
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
