# officework(エンジン)を PyPI へ出す。
#
# **PyPI の Trusted Publisher(OIDC)で出す** — API トークンを持たない。
# PyPI 側に登録する値:
#   PyPI Project Name : officework
#   Owner             : aiseed-dev
#   Repository name   : officework
#   Workflow name     : publish-pypi.yml
#   Environment name  : pypi
#
# 出し方: `v0.1.0` のような版のタグを押す。手で回すこともできる
# (Actions の画面から。dry_run を付けると PyPI へは上げず wheel だけ作る)。
#
# **手で回すときは「Use workflow from」でタグを選ぶ。** 枝(main)を選ぶと
# publish の段が飛ばされ、走行は「成功」と出るのに PyPI には何も上がらない
# (2026-08-17 に実際に起きた)。いまは `guard` の仕事が先に止めて理由を言う。
name: publish-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "PyPI へ上げずに wheel を作るだけ"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # **回し方が正しいかを先に見る。**
  #
  # publish の段は `refs/tags/v*` のときだけ動きます。枝(main)から
  # dry_run を外して回すと、wheel と sdist は出来るのに publish が skipped に
  # なり、**走行は「成功」と出るのに PyPI には何も上がりません**
  # (2026-08-17 に実際に起きた)。20分組んでから気づくのは遅いので、
  # 先に止めて理由を言います。
  guard:
    name: 回し方を見る
    runs-on: ubuntu-latest
    steps:
      - name: タグから回しているか
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run です。PyPI へは上げません(wheel と sdist を作るだけ)"
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) echo "タグ $GITHUB_REF から回しています。PyPI へ上げます" ;;
            *)
              echo "::error::PyPI へ上げるにはタグから回してください。いまの ref は $GITHUB_REF です。Actions の「Run workflow」で「Use workflow from」に v0.4.0 のようなタグを選んでください(このまま進めても publish は飛ばされ、何も上がりません)"
              exit 1
              ;;
          esac
          # **タグと版が同じかを見ます。**
          #
          # PyPI へ上がるのは `pysheet/Cargo.toml` の版で、タグの名前では
          # ありません。ずれると「v0.5.0 のタグを押したのに 0.4.9 が上がる」
          # が起き、しかも PyPI は同じファイルを2度受け取らないので**やり直しが
          # 効きません**。先に止めます(2026-08-28)
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(grep -m1 '^version' pysheet/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::タグ v$TAG と pysheet/Cargo.toml の版 $VER が違います。どちらかを直してください"
            exit 1
          fi
          echo "タグと版は $VER で揃っています"

  # 各プラットフォームの wheel。abi3-py310 なので **1枚で 3.10 以降を賄う**
  wheels:
    name: wheel (${{ matrix.os }})
    needs: [guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --release --out dist
          - os: macos-latest
            args: --release --out dist --target universal2-apple-darwin
          - os: windows-latest
            args: --release --out dist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # **失敗した回でも組んだ物を残す。** 既定では job が失敗すると
          # 保存しないので、組み立ての後ろの段で落ちるたびに、次の回も
          # 一から組み直しになる(2026-08-17、Windows が 12分14秒かけて
          # 組んだ後、その次の1行で落ちて結果が捨てられた)
          cache-on-failure: "true"
      - name: wheel を組む
        uses: PyO3/maturin-action@v1
        with:
          working-directory: pysheet
          args: ${{ matrix.args }}
          # Linux は古い glibc でも動くように manylinux の中で組む
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
          # **毎回まっさらから組み直さない。** Windows は NTFS とリンクが
          # 重く、他の2つより目に見えて遅い(2026-08-09 発注者指摘)。
          # sccache は manylinux の入れ物の中でも効く
          sccache: "true"
      - name: まっさらな環境で確かめる
        # **組めただけで良しとしない** — 入れて import して、実物の xlsx を
        # 往復させる。ここが通らないものは出さない
        shell: bash
        env:
          # Windows の既定の標準出力は cp1252 で、日本語を print すると
          # そこだけで落ちる(2026-08-09 に踏んだ。**中身は通っていた** —
          # セルの往復は成功していて、最後の print だけが死んでいた)
          PYTHONIOENCODING: utf-8
        run: |
          # **径路は書き下さない** — Windows に /tmp は無い(2026-08-09 に踏んだ)。
          # 仮想環境は作業場所の下に作り、書き先は tempfile に決めさせる
          python -m venv kensho-venv
          PY=kensho-venv/bin/python
          [ -f "$PY" ] || PY=kensho-venv/Scripts/python
          # **組んだ wheel だけを入れます。**
          #
          # `--find-links` だけだと PyPI にも取りに行きます。しかも pip は
          # 前触れの版(0.5.0b1 など)を既定で飛ばすので、β を出すときは
          # **古い安定版が入り、それを検査して通してしまいます**
          # (2026-08-28 に手元で踏みました。0.5.0b1 を組んだのに 0.4.0 が
          #  入り、画面が入っている・98MB という検査結果が出ました)。
          # `--no-index` で外を見ないようにし、`--pre` で前触れも受けます
          "$PY" -m pip install --quiet --no-index --pre \
              --find-links pysheet/dist officework
          "$PY" - <<'PYEOF'
          import os, tempfile
          from officework import sheet
          out = os.path.join(tempfile.mkdtemp(), "kensho.xlsx")
          b = sheet.Book.open("templates/在庫台帳.xlsx")
          s = b[0]
          assert s.shape[0] > 0, "行が読めていない"
          s["A1"] = "検査"
          b.save(out)
          assert sheet.Book.open(out)[0]["A1"] == "検査"
          print("往復できた:", b.sheet_names)
          PYEOF
          # **画面が入っていないことを確かめる**(2026-08-21 発注者
          # 「officework に画面をいれたのは間違い。ファイルだけに戻したい」)。
          # 前はここで「入っていること」を見ていた。決めが裏返ったので、
          # 見る向きも裏返す — *入っていたら落とす*。入れ忘れではなく
          # 入り込みが事故になる
          "$PY" - <<'PYEOF'
          import pathlib, officework
          bin_dir = pathlib.Path(officework.__file__).parent / "bin"
          入った = sorted(p.name for p in bin_dir.glob("*")) if bin_dir.exists() else []
          assert not 入った, f"wheel に実行ファイルが入っています: {入った}"
          size = sum(f.stat().st_size for f in pathlib.Path(officework.__file__).parent.rglob("*") if f.is_file())
          # 数 MB に戻っているはず。36MB の頃に戻っていたら気づけるように
          assert size < 20_000_000, f"荷物が大きすぎます({size/1e6:.0f}MB)。同梱が復活していませんか"
          print(f"画面は入っていない(荷物 {size/1e6:.1f}MB)")
          PYEOF
          # **入れ方の案内が出るか。** 画面が無い機械で打ったときに
          # 「見つかりません」だけで終わらせない、が決め
          BIN=kensho-venv/bin/officework
          [ -f "$BIN" ] || BIN=kensho-venv/Scripts/officework.exe
          [ -f "$BIN" ] || { echo "officework のコマンドが入っていません"; exit 1; }
          out=$("$BIN" 2>&1 || true)
          case "$out" in
            *aiseed*|*releases*) echo "案内が出た" ;;
            *) echo "画面が無いときの案内が出ません:"; echo "$out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: pysheet/dist

  # 元の形(sdist)。conda-forge はこちらを見る
  sdist:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: pysheet
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: pysheet/dist

  publish:
    needs: [wheels, sdist]
    # タグを押したときだけ。手回しのときは dry_run を外したときだけ
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publisher(OIDC)に要る
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # **既にある物は飛ばす。** PyPI は同じ名前のファイルを2回受け取らない
          # ので、一部だけ失敗した回をやり直すと、成功した分で必ず落ちる。
          # 2026-08-17 に踏んだ: wheel 3つは上がったのに sdist だけ 400 で
          # 落ち、やり直すと今度は wheel の重複で落ちる状態になった
          skip-existing: true
