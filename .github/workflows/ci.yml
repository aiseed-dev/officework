# push したら試験が回る。**緑を信じられる形にしておく**のが目的。
#
# **仕事は2つに分けてある。** 画面のいらない核は速いので毎回、GPUI を組む
# `calc` / `writer` / `ui` は遅いので別の仕事にした(2026-08-11)。
#
# 前は後者を**回していなかった**。理由は「取得と組み立てで何十分も掛かる」で、
# それ自体は本当だが、**代わりに何も見ていなかった**のが問題だった:
#
#   - `wiring_tests`(押せる見た目のボタンが全部配線されているか)が
#     `calc`/`writer` にあり、家の方針がそれに拠っていたのに走っていなかった
#     (2026-08-10。組み立てのいらない形に作り直して下の仕事に移した)
#   - `calc` 148 件・`writer` 38 件の試験も、**誰かが手で打ったときだけ**
#     走っていた。ファイルを割った日は手で基準を取ったが、**それは作法であって
#     仕掛けではない**
#
# **「完成した」と言うつもりなら、完成したままかを機械が見ている必要がある。**
# 遅いのは受け入れる — 落ちるより遅いほうがいい。
#
# **Python の側も回す。** 2026-08-10 に、配っている import 名(officework.sheet)と
# 文書の見本(office_sheet)が食い違っていたのを人手で見つけた。**素の環境で
# wheel を入れて見本どおりに動かす**検査があれば、その日のうちに落ちていた。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じ枝で走っているものは畳む(押し直したら前のは要らない)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 核の試験。画面はいらない
  test:
    name: cargo test (画面のいらない核)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 試験が要る物を入れる(フォントと辞書)
        # **同梱しない物に依っている試験がある。** 走らせる機械の持ち物を使う
        # のが製品の作りなので、CI にも入れる(隠して素通しにはしない):
        #   fonts-noto-cjk  paper は font::for_document(None).unwrap() で
        #                   日本語フォントを引く。無ければ「日本語のフォントが
        #                   見つかりません」で panic する(2026-08-10 初回の CI で踏んだ)
        #   wamerican       lang の綴り検査が /usr/share/dict/words を読む
        # 手元の機械には両方入っていたので緑に見えていた
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-ipaexfont wamerican
      - name: 試験
        # **--no-fail-fast。** 既定だと最初に落ちた試験バイナリで打ち切るので、
        # 1件の環境依存が残り4つの crate を丸ごと隠す(2026-08-10 に踏んだ —
        # kumihan の 1 件で paper・lang・sheet・ooxml が一度も走っていなかった)。
        # 直す回数だけ CI を回すことになるので、**全部出させてから読む**
        run: cargo test --no-fail-fast -p sheet -p kumihan -p ooxml -p lang -p paper
      - name: サイドカーが組めるか(pyoffice)
        run: cargo build -p sidecar
      - name: 押せる見た目のボタンが全部配線されているか
        # **外した crate の中に、外してはいけない検査が1つ紛れていた。**
        # 「ready の嘘は wiring_tests が落とす」という方針の当の検査が
        # calc/writer にあり、ここは gpui のせいで CI から外してある。つまり
        # その方針は**手元で誰かが cargo test を打ったときだけ**成り立っていた
        # (2026-08-10、fork セッションが CI の対象を数えて見つけた)。
        #
        # 組み立てずに原文の表を突き合わせる。読めなくなったら落ちる作りに
        # してある — **字面の検査が静かに緑になるのが一番悪い**
        run: python3 tools/wiring_check.py
      - name: 13言語のリボンが ja と同じ骨組みか
        # **一段下に同じ穴があった。** 上の検査は ja の1枚しか読まない。
        # `ribbon_<loc>.rs` は13言語ぶんあり「id・並び・ready・icon は ja と
        # 同じで語だけ違う」という約束だが、それを見ている試験は `ui` にあり、
        # `ui` も CI で走らない。生成でボタン1つが灰色に落ちても、
        # **その言語で使う人以外は誰も気づかない**(2026-08-10、fork セッション)
        run: python3 tools/ribbon_locale_check.py
      - name: 文書が実物より多く名乗っていないか
        # **家訓を破っていたのは画面ではなく文書だった。** 未実装のボタンは
        # ちゃんと灰色で並んでいたのに、README と手引きの3箇所が
        # 「グレー表示ゼロ」と言い続けていた(実際は calc に9個。2026-08-10)。
        # **読む人は文書を先に読む** — 画面が正直でも、文書が嘘なら嘘になる
        run: python3 tools/gray_claim_check.py
      - name: clippy
        # **-D warnings で止める。** 警告を貯めると新しい指摘が埋もれる。
        # ただし家の作法と噛み合わない4つだけ許す — どれも正しさの話ではなく
        # 書き方の好みで、直すと読みにくくなる方が大きい:
        #   too_many_arguments / type_complexity  組版と xlsx は引数も型も素で多い
        #   field_reassign_with_default           試験の下ごしらえ。構造体リテラルより読める
        #   needless_range_loop                   複数の配列を同じ添字で歩く所が多い
        # 日本語の試験名(non_snake_case)は**その場で**許してある。まとめて
        # 消すと、製品のコードの命名まで見なくなる
        run: |
          cargo clippy -p sheet -p kumihan -p ooxml -p lang -p paper -p sidecar --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::field_reassign_with_default \
            -A clippy::needless_range_loop

  # 画面のいる2つ。**遅い。** それでも走らせる — 走らせないと、直したものが
  # 壊れたことに push まで誰も気付かない
  apps:
    name: cargo test (画面のいる calc / writer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # GPUI は zed を git から取って組む。**掛かるのはほぼ初回だけ**なので、
      # 覆いが効くかどうかがこの仕事の速さを決める
      - uses: Swatinem/rust-cache@v2
      - name: GPUI が繋ぐ物を入れる
        # **組み上がったバイナリの `ldd` から起こした**(推測ではない):
        #   libxkbcommon / libxkbcommon-x11 / libxcb / libxcb-xkb
        #   (libXau・libXdmcp は libxcb1-dev が連れてくる)
        # wayland と vulkan は繋ぎ先に出てこない — 窓を開けるときの話で、
        # **試験は窓を開けない**(この機械で 148/38 が画面なしで通っている)。
        # フォントと辞書は核の仕事と同じ理由(同梱しない物に依る試験がある)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            cmake clang pkg-config fonts-noto-cjk fonts-ipaexfont wamerican
      - name: 試験
        # 2026-08-11 の基準は calc 148 / writer 38。**減ったら赤にする**のが
        # この仕事の役目で、数そのものはここに焼き付けない(増えるのが普通)
        run: cargo test -p calc -p writer --no-fail-fast
      - name: clippy
        # 画面の2つと `ui` も同じ物差しで見る。許す4つは核と揃える
        run: |
          cargo clippy -p calc -p writer -p ui --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::field_reassign_with_default \
            -A clippy::needless_range_loop

  # 配る形で確かめる。**手元の木ではなく wheel を入れた素の環境で**
  python:
    name: wheel を入れて見本どおりに動くか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wheel を組む
        run: |
          pip install maturin
          maturin build -m pysheet/Cargo.toml --release --out dist
      - name: 配ってはいけない物が入っていないか
        # **`.gitignore` に書いてあるだけでは止まらない。** maturin は
        # python-source の側を見ないので、組む機械に `.pyc` があれば同梱される。
        # CI は checkout 直後で `.pyc` が無いから緑になる — つまり**この検査は
        # 手元の事故を止めない**。止めるのは pyproject の exclude で、これは
        # その exclude が外れたときに気付くための見張り(2026-08-10)
        run: |
          if python3 -m zipfile -l dist/*.whl | grep -q __pycache__; then
            echo "::error::wheel に __pycache__ が入っています(pyproject の exclude を確かめてください)"
            python3 -m zipfile -l dist/*.whl | grep __pycache__
            exit 1
          fi
      - name: 素の環境へ入れる
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
      - name: 文書の見本がそのまま動くか
        # **README と手引きに載っている書き方をそのまま打つ。**
        # ここを手元の木で試すと、ソースの officework/ を掴んでしまい
        # 配った物を確かめたことにならない(2026-08-09 に踏んだ)
        env:
          BOOK: ${{ github.workspace }}/sample/見積書.xlsx
        run: |
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import os
          from officework import sheet

          b = sheet.Book.open(os.environ["BOOK"])
          assert b.sheet_names, "シートが読めていない"
          assert b.unsupported == [], f"読めなかった部品がある: {b.unsupported}"
          s = b[b.sheet_names[0]]
          s["A30"] = "日本フネン株式会社"
          b.save("/tmp/out.xlsx")

          again = sheet.Book.open("/tmp/out.xlsx")
          assert again[again.sheet_names[0]]["A30"] == "日本フネン株式会社"
          print("見本どおりに動いた:", b.sheet_names)
          PY
      - name: docx の見本もそのまま動くか
        # **README と手引きに載っている docx の書き方をそのまま打つ。**
        # 2026-08-10 の 0.1.2 で、見本が動かないまま配っていたのを踏んだので、
        # エンジンが増えるたびにここへ足す(sheet だけ緑でも足りない)
        env:
          DOC: ${{ github.workspace }}/sample/報告書.docx
        run: |
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import os
          from officework import doc

          d = doc.Doc.open(os.environ["DOC"])
          assert len(d) > 0, "段落が読めていない"
          assert d.unsupported == [], f"読めなかった部品がある: {d.unsupported}"
          assert d.tables, "表が読めていない"
          before = d.tables[0].values()

          n = d.replace("業務", "作業")
          assert n > 0, "置き換えが1件も起きない"
          d[0].text = "差し替えた見出し"
          d.save("/tmp/out.docx")

          again = doc.Doc.open("/tmp/out.docx")
          assert again[0].text == "差し替えた見出し", "差し込んだ字が保存されない"
          assert again.tables[0].values() == before, "保存で表が変わった"
          # **原本の部品が減っていないこと** — 売り文句の土台
          import zipfile
          with zipfile.ZipFile(os.environ["DOC"]) as z:
              a = set(z.namelist())
          with zipfile.ZipFile("/tmp/out.docx") as z:
              b = set(z.namelist())
          assert not (a - b), f"保存で原本の部品が消えた: {sorted(a - b)}"
          print("docx の見本どおりに動いた: 段落", len(again), "表", len(again.tables))
          PY

      - name: 存在しない名前が文書に残っていないか
        # office_sheet は 1cae2f0 で officework.sheet へ移した。**貼ると
        # ImportError になる名前が文書に残っていたら落とす**
        # 2026-08-10 に officework.doc を足した。**存在しない名前を増やさない** —
        # office_doc も officework.docx も import できない。
        # 見張るのは「動きそうに見えて動かない名前」だけ。officework.writer は
        # 設計文書が「今後こう増やす」と書いている先の話なので入れない
        run: |
          bad=0
          for name in office_sheet office_doc "officework\.docx"; do
            if grep -rn "$name" --include="*.md" . ; then
              echo "::error::$name は存在しない import 名です(officework.sheet / officework.doc へ)"
              bad=1
            fi
          done
          exit $bad
