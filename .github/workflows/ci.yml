# push したら試験が回る。**緑を信じられる形にしておく**のが目的。
#
# **仕事は2つに分けてある。** 画面のいらない核は速いので毎回、GPUI を組む
# `calc` / `writer` / `ui` は遅いので別の仕事にした(2026-08-11)。
#
# 前は後者を**回していなかった**。理由は「取得と組み立てで何十分も掛かる」で、
# それ自体は本当だが、**代わりに何も見ていなかった**のが問題だった:
#
#   - `wiring_tests`(押せる見た目のボタンが全部配線されているか)が
#     `calc`/`writer` にあり、家の方針がそれに拠っていたのに走っていなかった
#     (2026-08-10。組み立てのいらない形に作り直して下の仕事に移した)
#   - `calc` 148 件・`writer` 38 件の試験も、**誰かが手で打ったときだけ**
#     走っていた。ファイルを割った日は手で基準を取ったが、**それは作法であって
#     仕掛けではない**
#
# **「完成した」と言うつもりなら、完成したままかを機械が見ている必要がある。**
# 遅いのは受け入れる — 落ちるより遅いほうがいい。
#
# **Python の側も回す。** 2026-08-10 に、配っている import 名(officework.sheet)と
# 文書の見本(office_sheet)が食い違っていたのを人手で見つけた。**素の環境で
# wheel を入れて見本どおりに動かす**検査があれば、その日のうちに落ちていた。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じ枝で走っているものは畳む(押し直したら前のは要らない)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 核の試験。画面はいらない
  test:
    name: cargo test (画面のいらない核)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 試験が要る物を入れる(フォントと辞書)
        # **同梱しない物に依っている試験がある。** 走らせる機械の持ち物を使う
        # のが製品の作りなので、CI にも入れる(隠して素通しにはしない):
        #   fonts-noto-cjk  paper は font::for_document(None).unwrap() で
        #                   日本語フォントを引く。無ければ「日本語のフォントが
        #                   見つかりません」で panic する(2026-08-10 初回の CI で踏んだ)
        #   wamerican       lang の綴り検査が /usr/share/dict/words を読む
        # 手元の機械には両方入っていたので緑に見えていた
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-ipaexfont wamerican
      - name: 試験
        # **--no-fail-fast。** 既定だと最初に落ちた試験バイナリで打ち切るので、
        # 1件の環境依存が残り4つの crate を丸ごと隠す(2026-08-10 に踏んだ —
        # kumihan の 1 件で paper・lang・sheet・ooxml が一度も走っていなかった)。
        # 直す回数だけ CI を回すことになるので、**全部出させてから読む**。
        # ci-test.sh 越し — 落ちたら試験の**名前**を走行ページの要約に書き出す
        # (ログは認証が要り、貼られる尻尾に名前が無い往復を4回やった)
        run: bash tools/ci-test.sh --no-fail-fast -p sheet -p kumihan -p ooxml -p lang -p paper -p sidecar -p pyrun -p ops -p face
      - name: サイドカーが組めるか(pyoffice)
        run: cargo build -p sidecar
      - name: Windows の的でも組めるか(pysheet — 配る wheel の3つ目の OS)
        # v0.2.0 のタグで初めて発覚: pysheet が ops に依存した日に、ops の
        # unix 専用 API(sock_path の uid・/dev/urandom・0600)が Windows の
        # wheel を壊した。push のたびにここで見る — タグを押してから知るのは遅い
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check -p pysheet --target x86_64-pc-windows-msvc
      - name: スマホの的でも組めるか(pysheet の wheel と sidecar の橋)
        # 2026-08-13 発注者「Android/iOS 版の wheel を」「FFI を優先」。
        # 手元の実測では全部一発で通った(依存が純 Rust + unix なので)—
        # この状態を保つ見張り。sidecar はスマホでは関数の橋(ffi)として
        # アプリに焼き込む(iOS はサブプロセス禁止)。wheel と .a/.so を
        # 実際に組む仕事は配布の車線で別途
        run: |
          rustup target add aarch64-linux-android aarch64-apple-ios
          cargo check -p pysheet --target aarch64-linux-android
          cargo check -p pysheet --target aarch64-apple-ios
          cargo check -p sidecar --target aarch64-linux-android
          cargo check -p sidecar --target aarch64-apple-ios
          # lang は feature "ai"(rustls)を外した形で — スマホの組み方
          cargo check -p lang --no-default-features --target aarch64-linux-android
          cargo check -p lang --no-default-features --target aarch64-apple-ios
          # **face(持ち運べる層)がスマホで組めること。** 発注者 2026-08-15
          # 「GPUI の殻を kotlin と swift で書く」の土台がこれ — リボンの表・
          # 14言語の札・キーの割り当て・関数名の表が、殻を替えても使える。
          # **組めなくなったらここで止める**(2026-08-15 の実測では両方緑)
          cargo check -p face --target aarch64-linux-android
          cargo check -p face --target aarch64-apple-ios
      - name: リボンの表を読む解析器が、崩れたら止まるか
        # **検査を信じる前に、落ちる所を見る。** 6つの崩し方(新しい種類・
        # マクロ書き・Tab を関数で作る・引数が増える・`/* */` で囲む・
        # 表がもう1つ)それぞれで止まることを確かめる。
        # 下の3つの検査は全部この解析器を通るので、**ここが効かなければ
        # 3つとも静かに緑になる**(2026-08-12)
        run: python3 tools/ribbon_parse.py --self-test
      - name: 押せる見た目のボタンが全部配線されているか
        # **外した crate の中に、外してはいけない検査が1つ紛れていた。**
        # 「ready の嘘は wiring_tests が落とす」という方針の当の検査が
        # calc/writer にあり、ここは gpui のせいで CI から外してある。つまり
        # その方針は**手元で誰かが cargo test を打ったときだけ**成り立っていた
        # (2026-08-10、fork セッションが CI の対象を数えて見つけた)。
        #
        # 組み立てずに原文の表を突き合わせる。読めなくなったら落ちる作りに
        # してある — **字面の検査が静かに緑になるのが一番悪い**
        run: python3 tools/wiring_check.py
      - name: 13言語のリボンが ja と同じ骨組みか
        # **一段下に同じ穴があった。** 上の検査は ja の1枚しか読まない。
        # `ribbon_<loc>.rs` は13言語ぶんあり「id・並び・ready・icon は ja と
        # 同じで語だけ違う」という約束だが、それを見ている試験は `ui` にあり、
        # `ui` も CI で走らない。生成でボタン1つが灰色に落ちても、
        # **その言語で使う人以外は誰も気づかない**(2026-08-10、fork セッション)
        run: python3 tools/ribbon_locale_check.py
      - name: writer の押せるボタンが段の並びに載っているか
        # **配線の検査の裏側にもう1つ穴があった。** 上は「腕があるか」しか
        # 見ない。writer は「何があるか」(ribbon.rs)と「どう並べるか」
        # (view.rs の *_ROWS)で正本が2つあり、並びに書き忘れたボタンは
        # **押せる約束なのに画面に出ない**。灰色の裏返しで、同じ嘘。
        # 2026-08-17 に印刷レイアウトと脚注の2つがこれで消えていた
        run: python3 tools/writer_rows_check.py
      - name: 設定の置き場の名前が実物と揃っているか
        # **利用者が最初に読む所が、いちばん古かった。** 2026-08-16 に
        # 置き場を ~/.config/office → officework へ移したのに、リリースの
        # 言い分・.deb の説明・乗り換えの手引きが古い名前のままで、しかも
        # UDF の置き場は plugins から funcs に分けた後だった —
        # **言われたとおりに置いても動かない**案内を配るところだった
        run: python3 tools/config_dir_check.py
      - name: 画面の文言が対訳の表を通っているか
        # **さらに一段下に同じ穴があった。** 上の2つはリボンの札しか見ない。
        # 画面の案内・状態行・パネルの札は `ui::t!` で書くが、その日本語が
        # 対訳の材料に無ければ**13言語すべてで日本語のまま出る** — 試験も
        # 画面も何も言わない。2026-08-15、左右のパネルで 48 句が素通りした
        run: python3 tools/t_table_check.py
      - name: 文書が実物より多く名乗っていないか
        # **家訓を破っていたのは画面ではなく文書だった。** 未実装のボタンは
        # ちゃんと灰色で並んでいたのに、README と手引きの3箇所が
        # 「グレー表示ゼロ」と言い続けていた(実際は calc に9個。2026-08-10)。
        # **読む人は文書を先に読む** — 画面が正直でも、文書が嘘なら嘘になる
        run: python3 tools/gray_claim_check.py
      - name: 廃止した方針が現在形で文書に残っていないか
        # 2026-08-09 に「ブックはコードを運ばない」が確定したのに、README は
        # 9日間「載せて持ち運べます」と言い続けていた(2026-08-12 発見)。
        # マニュアルは同じ回で直っていた — README だけ思い出し頼みだった。
        # 対象は使い方の帳簿(README・マニュアル)だけ。設計(SEKKEI と
        # docs/sekkei/)は経緯を残す場所なので見ない。
        # **限界**: 表に載せた語しか見ない。廃止を決めた回で表にも足すこと
        # (SEKKEI 書き込みの規則6)
        run: python3 tools/sunset_check.py
      - name: キーの一覧が束縛の表と揃っているか
        # 手引きの「すべてのキー」は face/src/keys.rs の KEYS_* から自動生成
        # (tools/keys_doc.py --write)。手で書いた表は必ずずれる —
        # 鍵を足した回でこの門番が落ちたら、--write で書き直してコミット
        run: python3 tools/keys_doc.py
      - name: face に gpui が混ざっていないか(孫まで)
        # **持ち運べる層の値打ちは「gpui を持たないこと」そのもの**
        # (発注者 2026-08-15「GPUI の殻を kotlin と swift で書く」)。
        # face/src/lib.rs の試験は直の依存しか見ないので、孫まではここで見る。
        # GPL の3クレート(ztracing / zlog / ztracing_macro)は gpui 経由で
        # しか来ないため、同じ検査で一緒に止まる
        run: |
          if cargo tree -p face -e normal --prefix none \
             | grep -E '^(gpui|ztracing|zlog|ztracing_macro) '; then
            echo "::error::face に gpui 系が入りました。描く物は ui / calc / writer の側へ"
            exit 1
          fi
          echo "face は gpui を孫まで含めて引いていません"
      - name: clippy
        # **-D warnings で止める。** 警告を貯めると新しい指摘が埋もれる。
        # ただし家の作法と噛み合わない4つだけ許す — どれも正しさの話ではなく
        # 書き方の好みで、直すと読みにくくなる方が大きい:
        #   too_many_arguments / type_complexity  組版と xlsx は引数も型も素で多い
        #   field_reassign_with_default           試験の下ごしらえ。構造体リテラルより読める
        #   needless_range_loop                   複数の配列を同じ添字で歩く所が多い
        # 日本語の試験名(non_snake_case)は**その場で**許してある。まとめて
        # 消すと、製品のコードの命名まで見なくなる
        run: |
          bash tools/ci-clippy.sh -p sheet -p kumihan -p ooxml -p lang -p paper -p sidecar -p pyrun -p ops -p face --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::field_reassign_with_default \
            -A clippy::needless_range_loop

  # 画面のいる2つ。**遅い。** それでも走らせる — 走らせないと、直したものが
  # 壊れたことに push まで誰も気付かない。
  #
  # **Linux と macOS の両方で回す**(2026-08-13 発注者「Linux 以外も CI に」)。
  # GPUI は zed 育ちなので mac は本場。mac の runner は下ごしらえが要らない —
  # cmake/clang は標準、日本語フォントは Hiragino が /System/Library/Fonts に、
  # 綴りの辞書 /usr/share/dict/words も標準で居る
  apps:
    name: cargo test (画面のいる calc / writer — ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方が落ちても、もう片方は最後まで走らせて全部見る(--no-fail-fast と同じ理屈)
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # GPUI は zed を git から取って組む。**掛かるのはほぼ初回だけ**なので、
      # 覆いが効くかどうかがこの仕事の速さを決める
      - uses: Swatinem/rust-cache@v2
      - name: GPUI が繋ぐ物を入れる(Linux だけ)
        # **組み上がったバイナリの `ldd` から起こした**(推測ではない):
        #   libxkbcommon / libxkbcommon-x11 / libxcb / libxcb-xkb
        #   (libXau・libXdmcp は libxcb1-dev が連れてくる)
        # wayland と vulkan は繋ぎ先に出てこない — 窓を開けるときの話で、
        # **試験は窓を開けない**(この機械で 148/38 が画面なしで通っている)。
        # フォントと辞書は核の仕事と同じ理由(同梱しない物に依る試験がある)。
        #
        # **libfontconfig1-dev は ldd に出ない**のに要る(2026-08-13 に赤で
        # 発見)— zed-font-kit の yeslogic-fontconfig-sys が**組む時**に
        # pkg-config で fontconfig.pc を探す。ldd は実行時の繋ぎ先しか
        # 見せないので、この物差しには組む時だけの依存という盲点がある
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev \
            cmake clang pkg-config fonts-noto-cjk fonts-ipaexfont wamerican
      - name: 日本語フォントを入れる(macOS だけ)
        # **組版の試験は「入っている日本語書体」で字幅を測る。** Linux は apt の
        # Noto、mac は Hiragino、Windows は成り行き — 書体が違えば字幅が違い、
        # 座標を見る試験が OS ごとに割れる(2026-08-13 に mac と Windows の
        # kumihan で踏んだ)。だから3 OS とも**同じ Noto Sans CJK JP を1枚**
        # 置いて、font.rs の探索(OFFICE_FONT_DIR)に指させる — fallback() の
        # 好みの並びの筆頭なので、これが在れば必ずこれで測る。版は固定
        # (Sans2.004)— 落ちてきた物が変わると字幅の物差しが黙って変わる。
        # env は **step に置く**(runner コンテキストはジョブの env では
        # 使えない — 2026-08-13 に workflow ごと無効になって踏んだ)
        if: runner.os == 'macOS'
        env:
          OFFICE_FONT_DIR: ${{ runner.temp }}/jpfonts
        run: |
          mkdir -p "$OFFICE_FONT_DIR"
          curl -sSL -o "$OFFICE_FONT_DIR/NotoSansCJKjp-Regular.otf" \
            https://github.com/googlefonts/noto-cjk/raw/Sans2.004/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          # 明朝も要る — 「明朝の書類はゴシックに化けない」の試験は、代替の
          # 名前に「明朝」か「Serif」を要求する。Linux の apt fonts-noto-cjk は
          # Sans と Serif の両方が入るのに、ここが Sans 1枚だと mac は
          # Hiragino の英語名(Mincho)が照合に掛からず、Windows は明朝が
          # そもそも無くて、どちらも落ちる(2026-08-13 に踏んだ)
          curl -sSL -o "$OFFICE_FONT_DIR/NotoSerifCJKjp-Regular.otf" \
            https://github.com/googlefonts/noto-cjk/raw/Serif2.002/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
      - name: 試験
        # 2026-08-11 の基準は calc 148 / writer 38。**減ったら赤にする**のが
        # この仕事の役目で、数そのものはここに焼き付けない(増えるのが普通)。
        # OFFICE_FONT_DIR は Linux では空(apt の Noto を使う — 結局同じ書体)
        env:
          OFFICE_FONT_DIR: ${{ runner.temp }}/jpfonts
        run: bash tools/ci-test.sh -p calc -p writer --no-fail-fast
      - name: 核の試験も(macOS だけ)
        # 核は Linux では自分の仕事(test)を持っている。mac のぶんはこの
        # runner に相乗り — 仕事を増やすより、組んだ土台を使い回すほうが安い
        if: runner.os == 'macOS'
        env:
          OFFICE_FONT_DIR: ${{ runner.temp }}/jpfonts
        run: bash tools/ci-test.sh --no-fail-fast -p sheet -p kumihan -p ooxml -p lang -p paper -p sidecar -p pyrun -p ops
      - name: clippy
        # 画面の2つと `ui` も同じ物差しで見る。許す4つは核と揃える。
        # **Linux だけ** — 指摘は的でほぼ変わらず、mac で二度見る値打ちより
        # runner の時間が惜しい(mac 固有の cfg 枝はうちのコードにほぼ無い)
        if: runner.os == 'Linux'
        run: |
          bash tools/ci-clippy.sh -p calc -p writer -p ui --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::field_reassign_with_default \
            -A clippy::needless_range_loop

  # 核を Windows でも(2026-08-13 発注者「Linux 以外も CI に」)。
  # アプリ(calc/writer)はまだ — rpc の受け口は cfg(unix) で塞いだが、
  # GPUI の Windows の的で組めるかは別の工事(配布方針の Win ビルドと同じ車線)。
  # フォント: Windows は日本語フォント(Yu Gothic — .ttc)が標準で、
  # engine/src/font.rs は .ttc も C:\Windows\Fonts も読める。
  # 辞書: /usr/share/dict/words が無い — 綴りの試験は「無ければ飛ばす
  # (そう言う)」に直した(lang/src/spell.rs)
  core-windows:
    name: cargo test (核 — Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 日本語フォントを入れる
        # apps の仕事のフォントの段と同じ理由 — 3 OS とも同じ Noto で字幅を
        # 測る。Server の runner は日本語書体の有無すら保証が無い。
        # env は step に置く(runner はジョブの env では使えない)
        env:
          OFFICE_FONT_DIR: ${{ runner.temp }}/jpfonts
        run: |
          New-Item -ItemType Directory -Force "$env:OFFICE_FONT_DIR" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/googlefonts/noto-cjk/raw/Sans2.004/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf" -OutFile "$env:OFFICE_FONT_DIR/NotoSansCJKjp-Regular.otf"
          # 明朝も(apps の mac の段と同じ理由 — 明朝の代替の試験が要る)
          Invoke-WebRequest -Uri "https://github.com/googlefonts/noto-cjk/raw/Serif2.002/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf" -OutFile "$env:OFFICE_FONT_DIR/NotoSerifCJKjp-Regular.otf"
      - name: 試験
        # shell: bash — Windows でも Git Bash で ci-test.sh(落ちた試験の
        # 名前を要約に書き出す)をそのまま使う。pwsh 版を別に持つと必ずずれる
        shell: bash
        env:
          OFFICE_FONT_DIR: ${{ runner.temp }}/jpfonts
        run: bash tools/ci-test.sh --no-fail-fast -p sheet -p kumihan -p ooxml -p lang -p paper -p sidecar -p pyrun -p ops

  # 配る形で確かめる。**手元の木ではなく wheel を入れた素の環境で**
  python:
    name: wheel を入れて見本どおりに動くか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wheel を組む
        run: |
          pip install maturin
          maturin build -m pysheet/Cargo.toml --release --out dist
      - name: 配ってはいけない物が入っていないか
        # **`.gitignore` に書いてあるだけでは止まらない。** maturin は
        # python-source の側を見ないので、組む機械に `.pyc` があれば同梱される。
        # CI は checkout 直後で `.pyc` が無いから緑になる — つまり**この検査は
        # 手元の事故を止めない**。止めるのは pyproject の exclude で、これは
        # その exclude が外れたときに気付くための見張り(2026-08-10)
        run: |
          if python3 -m zipfile -l dist/*.whl | grep -q __pycache__; then
            echo "::error::wheel に __pycache__ が入っています(pyproject の exclude を確かめてください)"
            python3 -m zipfile -l dist/*.whl | grep __pycache__
            exit 1
          fi
      - name: 素の環境へ入れる
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
      - name: 文書の見本がそのまま動くか
        # **README と手引きに載っている書き方をそのまま打つ。**
        # ここを手元の木で試すと、ソースの officework/ を掴んでしまい
        # 配った物を確かめたことにならない(2026-08-09 に踏んだ)
        env:
          BOOK: ${{ github.workspace }}/sample/見積書.xlsx
        run: |
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import os
          from officework import sheet

          b = sheet.Book.open(os.environ["BOOK"])
          assert b.sheet_names, "シートが読めていない"
          assert b.unsupported == [], f"読めなかった部品がある: {b.unsupported}"
          s = b[b.sheet_names[0]]
          s["A30"] = "日本フネン株式会社"
          b.save("/tmp/out.xlsx")

          again = sheet.Book.open("/tmp/out.xlsx")
          assert again[again.sheet_names[0]]["A30"] == "日本フネン株式会社"
          print("見本どおりに動いた:", b.sheet_names)
          PY
      - name: docx の見本もそのまま動くか
        # **README と手引きに載っている docx の書き方をそのまま打つ。**
        # 2026-08-10 の 0.1.2 で、見本が動かないまま配っていたのを踏んだので、
        # エンジンが増えるたびにここへ足す(sheet だけ緑でも足りない)
        env:
          DOC: ${{ github.workspace }}/sample/報告書.docx
        run: |
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import os
          from officework import doc

          d = doc.Doc.open(os.environ["DOC"])
          assert len(d) > 0, "段落が読めていない"
          assert d.unsupported == [], f"読めなかった部品がある: {d.unsupported}"
          assert d.tables, "表が読めていない"
          before = d.tables[0].values()

          n = d.replace("業務", "作業")
          assert n > 0, "置き換えが1件も起きない"
          d[0].text = "差し替えた見出し"
          d.save("/tmp/out.docx")

          again = doc.Doc.open("/tmp/out.docx")
          assert again[0].text == "差し替えた見出し", "差し込んだ字が保存されない"
          assert again.tables[0].values() == before, "保存で表が変わった"
          # **原本の部品が減っていないこと** — 売り文句の土台
          import zipfile
          with zipfile.ZipFile(os.environ["DOC"]) as z:
              a = set(z.namelist())
          with zipfile.ZipFile("/tmp/out.docx") as z:
              b = set(z.namelist())
          assert not (a - b), f"保存で原本の部品が消えた: {sorted(a - b)}"
          print("docx の見本どおりに動いた: 段落", len(again), "表", len(again.tables))
          PY
      - name: 名前つき記入欄の見本もそのまま動くか
        # README の d.fill("宛先", …) の行を配った wheel で打つ。sample に
        # 記入欄つきの docx が無いので、最小の w:sdt(本文と表の中に1つずつ)を
        # その場で作って fields / fill / extract を通す(2026-08-13 に追加)
        run: |
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import zipfile
          doc_xml = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
          <w:body>
          <w:p><w:sdt><w:sdtPr><w:tag w:val="宛先"/><w:text/></w:sdtPr>
          <w:sdtContent><w:r><w:rPr><w:b/></w:rPr><w:t>ここに社名</w:t></w:r></w:sdtContent></w:sdt></w:p>
          <w:tbl><w:tblGrid><w:gridCol w:w="4000"/></w:tblGrid>
          <w:tr><w:tc><w:p><w:sdt><w:sdtPr><w:tag w:val="金額"/><w:text/></w:sdtPr>
          <w:sdtContent><w:r><w:t>0</w:t></w:r></w:sdtContent></w:sdt></w:p></w:tc></w:tr></w:tbl>
          </w:body></w:document>'''
          ct = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
          <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
          <Default Extension="xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
          </Types>'''
          rels = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
          <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
          </Relationships>'''
          with zipfile.ZipFile("/tmp/fields.docx", "w") as z:
              z.writestr("[Content_Types].xml", ct)
              z.writestr("_rels/.rels", rels)
              z.writestr("word/document.xml", doc_xml)

          from officework import doc
          d = doc.Doc.open("/tmp/fields.docx")
          assert d.fields() == [("宛先", "ここに社名"), ("金額", "0")], d.fields()
          assert d.fill("宛先", "日本フネン株式会社") == 1
          assert d.fill("無い名前", "x") == 0, "無い欄で黙って成功してはいけない"
          assert d.extract("宛先") == "日本フネン株式会社"
          assert d.extract("無い名前") is None
          d.save("/tmp/fields-out.docx")
          again = doc.Doc.open("/tmp/fields-out.docx")
          assert again.fields() == [("宛先", "日本フネン株式会社"), ("金額", "0")], "保存で欄が壊れた"
          print("記入欄の見本どおりに動いた:", again.fields())
          PY

      - name: 存在しない名前が文書に残っていないか
        # office_sheet は 1cae2f0 で officework.sheet へ移した。**貼ると
        # ImportError になる名前が文書に残っていたら落とす**
        # 2026-08-10 に officework.doc を足した。**存在しない名前を増やさない** —
        # office_doc も officework.docx も import できない。
        # 見張るのは「動きそうに見えて動かない名前」だけ。officework.writer は
        # 設計文書が「今後こう増やす」と書いている先の話なので入れない
        run: |
          bad=0
          for name in office_sheet office_doc "officework\.docx"; do
            if grep -rn "$name" --include="*.md" . ; then
              echo "::error::$name は存在しない import 名です(officework.sheet / officework.doc へ)"
              bad=1
            fi
          done
          exit $bad
