[package]
name = "paper"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# 組んだ紙面を紙(PDF)へ写すだけ。engine は PDF を知らないままにしておく
# (engine の設計: 画面も紙も、同じ紙面を別の面に写す)
[dependencies]
book = { path = "../book" }
kumihan = { path = "../engine" }
printpdf = { version = "0.7", features = ["embedded_images"] }
# 画像の復号(printpdf の embedded_images が使うのと同じ crate)
image = "0.24"
pdf-writer = "0.15.0"
subsetter = "0.2.6"
ttf-parser = "0.25.1"
flate2 = "1.1.9"

[dev-dependencies]
ooxml = { path = "../ooxml" }
