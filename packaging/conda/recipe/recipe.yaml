# conda-forge へ出す recipe の下書き(v1 形式。2026-08-14 に v0 から作り直し)。
# 提出先はこの repo ではなく conda-forge/staged-recipes —
# ここに置くのは**下書きと検証の控え**(手順は隣の README.ja.md)。
#
# **v1(recipe.yaml)が必須**: staged-recipes は 2026-08-14 時点で
# 「New recipes should use the v1 format. The v0 meta.yaml format is
# deprecated for new recipes」— v0 で出すと差し戻される(実測で確認)。
# 書き方の正典: https://prefix-dev.github.io/rattler-build/latest/reference/recipe_file/
#
# 版と sha256 は提出時に差し替える(下は 0.2.0 = いま PyPI にある実物。
# 0.3.0 のタグが通ったら取り直す):
#   curl -s https://pypi.org/pypi/officework/json \
#     | python3 -c "import json,sys; d=json.load(sys.stdin); \
#       [print(u['digests']['sha256']) for u in d['urls'] if u['packagetype']=='sdist']"

context:
  version: "0.2.0"

package:
  name: officework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/officework/officework-${{ version }}.tar.gz
  sha256: 673125f41143bedce3e73dad943190dc7944a6960207043cbc2108875fe49972

build:
  number: 0
  # Windows は後(まず Linux / mac。publish-pypi の wheel はある)
  skip:
    - win
  # sdist は path 依存(sheet / engine / ooxml)を同梱している —
  # maturin sdist で検証済み(2026-08-12。取り出した木だけで cargo が解ける)
  script:
    # AGPL の表示義務: Rust の依存の免許を束ねて同梱する
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.9,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - officework
  - script:
      - python -c "from officework import sheet, doc, calc, tex"

about:
  homepage: https://github.com/aiseed-dev/officework
  repository: https://github.com/aiseed-dev/officework
  documentation: https://github.com/aiseed-dev/officework/blob/main/docs/python-manual.md
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: An openpyxl / python-docx / xlwings alternative — xlsx and docx engines that keep forms intact and recalculate formulas
  description: |
    Write values into real-world xlsx forms while borders, merges, column
    widths and number formats survive untouched; edit docx the same way
    (only what you changed is written back). Formulas recalculate on
    reopen. Code written for openpyxl, xlwings or python-docx largely
    runs as-is. `officework.tex` typesets LaTeX equations (TeX if
    installed, matplotlib's mathtext otherwise). `from officework import
    calc` attaches to a running calc (xlwings-style Book/Range) when the
    desktop app is present.

extra:
  recipe-maintainers:
    # 提出前に発注者の GitHub ID に差し替える(組織名は不可 — 個人の
    # アカウントで、PR に「maintainer になる」と一言コメントが要る)
    - aiseed-dev
