[package]
name = "sidecar"    # pyoffice: genoffice の xlsx サイドカーと同じ言葉を喋る
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "officework エンジンを、genoffice の xlsx サイドカーの言葉で喋らせる"

[lib]
name = "sidecar"
# rlib は試験と bin のため。staticlib / cdylib はスマホのため — iOS は
# サブプロセスを起こせないので、橋を関数(src/lib.rs の ffi)でアプリに
# 焼き込む(iOS は .a、Android は .so)。2026-08-13 発注者「FFI を優先」
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "xlsx-sidecar"   # **向こうと同じ名前。** XLSX_SIDECAR_PATH で差し替えられる
path = "src/main.rs"

[dependencies]
book = { path = "../book" }
sheet = { path = "../sheet" }
kumihan = { path = "../engine" }
# **JSON だけは自分で書かない。** 通信の言葉は向こうが決めた物で、
# こちらに直す権利がない。手書きの parser は静かに間違える場所そのもの。
# 核(sheet)には入れない — ここは末端の実行ファイルだけの依存
serde_json = "1"
# 原本の部品の数を数え、配管(取り出し・差し替え・書き出し)を回す
zip = { version = "2", default-features = false, features = ["deflate"] }
# 図形と画像は**モデルを通さず原本の drawing から読む** — 契約が欲しいのは
# 原本どおりのアンカーと `drawingPath`/`drawingIndex`(保存側の位置指定)で、
# officework のモデルはそれを持たない。sheet と同じ版に揃える
quick-xml = "0.36"
