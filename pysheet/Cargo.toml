[package]
name = "pysheet"    # sheet を Python から呼ぶ(pandas で集計 → 帳票の枠を保ったまま差し込む)
version = "0.5.0-beta.3"
edition.workspace = true
license.workspace = true
description = "officework のエンジンの Python 束縛(xlsx = sheet、docx = ooxml)。原本を正として、変えた所だけ書き戻す"

[lib]
# Python からは `from officework import sheet` で見える。
# **3つ目のエンジン(docx / pptx)が来ても同じ名前空間に入る**ように、
# 平場ではなく officework の副モジュールにしてある(発注者 2026-08-09
# 「writer や powerpoint 用も作ることも想定しておいて」)
name = "_sheet"
crate-type = ["cdylib"]

[build-dependencies]
# mac で extension-module の cdylib を組むためのリンカ指定(build.rs 参照)
pyo3-build-config = "0.29"

[dependencies]
book = { path = "../book" }
sheet = { path = "../sheet" }
# 操作の言葉。gpui を知らない層なので Python からも使える(画像の寸法読みなど)
ops = { path = "../ops" }
# docx。**同じ wheel に同居させる**(officework.sheet と officework.doc を
# 別々に入れさせない — 発注者 2026-08-09「同じ名前空間に入る」)
ooxml = { path = "../ooxml" }
kumihan = { path = "../engine" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[features]
# 配る .so はこれを付けて組む(libpython に依存しない、どの 3.10+ でも動く):
#   cargo build -p pysheet --release --features extension-module
# 既定で付けないのは cargo test のため — extension-module は Python の記号を
# 未解決のまま残すので、試験の実行ファイルがリンクできなくなる(pyo3 の FAQ どおり)
extension-module = ["pyo3/extension-module"]
