# officework — PyPI へ出す形(2026-08-09 発注者「officework エンジンを
# PyPI と conda-forge に公開するところから始めましょう」)。
#
# **配る名前は officework、import する名前は2つ**:
#   from officework import sheet   → エンジン(単体で xlsx。アプリ不要)
#   from officework import calc    → 橋(動いている calc を操る)
# **3つ目・4つ目のエンジン(docx / pptx)が来ても同じ名前空間に入る** —
# officework._doc / officework._slide を足すだけ(発注者 2026-08-09)。
#
# 組み方:
#   cd pysheet && maturin build --release          # wheel(abi3-py310)
#   maturin develop                                 # 手元の .venv へ入れる
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "officework"
description = "An openpyxl / python-docx / xlwings alternative: xlsx and docx engines that keep your forms intact and recalculate formulas, plus a bridge to a running office app"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
# **これが無いと sdist が PyPI に拒まれる。** 書かないと maturin は
# PKG-INFO に「License-File: LICENSE」と書くのに、実物を
# officework-<版>/pysheet/LICENSE に置く(この crate は workspace の
# 一員なので、sdist の中では pysheet/ の下に入る)。PyPI は宣言どおりの
# 場所にあるかを見るので、400 で落ちる。明示すると根にも複製が置かれる
# (2026-08-17、0.4.0 の公開で踏んだ。wheel 3つは上がり sdist だけ落ちた)
license-files = ["LICENSE"]
authors = [{ name = "Yasuhiro Niji" }]
keywords = ["xlsx", "docx", "excel", "word", "spreadsheet", "office", "openpyxl", "python-docx", "xlwings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Natural Language :: Japanese",
]
dynamic = ["version"]

# pandas は使うときだけ(options(pd.DataFrame) を呼んだときに import する)。
# **必須にしない** — 値の出し入れだけなら要らないため
[project.optional-dependencies]
pandas = ["pandas"]
# **MCP の口**(2026-08-15 発注者「MCP ツールを実装するのでもいいのかも」)。
# `officework-mcp` を AI の客(Claude Code / Claude Desktop など)に
# 登録すると、その AI が動いている calc を道具として使える。
# **任意にしてある** — 使わない人に mcp とその蔓(pydantic ほか)を
# 背負わせない
mcp = ["mcp"]

# **アプリを起こす口**。`officework` と打つと、機械に入っている
# aiseed office を探して起こします。**実行ファイルはこの wheel には
# 入っていません**(2026-08-21。SEKKEI「wheel からアプリを外す」) —
# 入っていなければ、入れ方を言って終わります
[project.scripts]
# **入り口は officework の1つ**(2026-08-19 発注者確定。SEKKEI 段11)。
# 表も文章も同じ窓のタブで開くので、コマンドを2つに分ける理由が
# なくなりました。officework-calc / officework-writer は外しました
officework = "officework.app:main"
# MCP の受け口(標準入出力で話す)。`pip install "officework[mcp]"` が要る
officework-mcp = "officework.mcp:main"

[project.urls]
Homepage = "https://github.com/aiseed-dev/officework"
Source = "https://github.com/aiseed-dev/officework"

[tool.maturin]
# エンジン(Rust)は officework._sheet、橋(純 Python)は officework/ をそのまま同梱
module-name = "officework._sheet"
python-source = "."
features = ["pyo3/extension-module"]
# **`__pycache__` を配らない。** `python-source` は officework/ を丸ごと取るので、
# 組む前に手元で python を走らせていると、そのとき出来た `.pyc` がそのまま入る。
# `.gitignore` には書いてあるが maturin は python-source の側では見ない。
#
# 正しさの害は小さい(pip が入れるときに焼き直して上書きする)が、2つ困る:
#   - wheel の tag は cp310-abi3 で 3.10 以降を1枚で賄うのに、入る .pyc は
#     特定の版専用。他の版では一切使われない
#   - **同じコミットから組んでも同じ wheel にならない** — 直前にどの python が
#     ソース木を触ったかで中身が変わる。実際 0.0.1 は 314 が2本、0.1.0 は
#     312 と 314 が3本入っていた(2026-08-10 に手元の wheel で確認)
exclude = ["**/__pycache__/**"]
# **アプリの実行ファイルは配りません**(2026-08-21 発注者。SEKKEI
# 「officework の wheel からアプリを外す」)。2026-08-15 の同梱の決めを
# 覆したものです。
#
# 発注者「officework に画面をいれたのは間違い。ファイルだけに戻したい」。
# この wheel は **docx / xlsx のファイル操作エンジン**で、名前と中身が
# 一致します。同梱をやめたので 36MB から数 MB に戻ります。
#
# 画面は **aiseed office** の名で別に配ります(deb / tar.gz / dmg /
# setup.exe / Flatpak)。`officework` の口はそちらを探して起こすだけです
