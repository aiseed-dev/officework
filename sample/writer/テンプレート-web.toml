# **Web に書き出すときの書式。** ファイル > Web の形で書き出す(HTML)で
# 使われます。画面と保存は隣の テンプレート.toml のままです。
#
# [送り先] を書いてあるので、本文の記入欄がそのまま送れる申込用紙になります。

[組み方]
横幅 = "可変"     # 紙の幅ではなく窓の幅で組む
区切り = "なし"   # ページに折らない(1本の流れ)

[文書]
大きさ = 11

[スタイル.本文]
行間 = 1.6
後の空き = 6
字下げ = 0        # Web では1字下げをしない(段落の間を空けて見せる)

[スタイル.見出し1]
大きさ = 22
太字 = true
色 = "1B6E3C"
前の空き = 16
後の空き = 6

[スタイル.見出し2]
大きさ = 16
太字 = true
後の空き = 4

[スタイル.見出し3]
大きさ = 13
太字 = true

[スタイル.引用]
斜体 = true
色 = "555555"

[スタイル.強調の囲み]
太字 = true
背景色 = "F2F7EA"

[スタイル.注意]
色 = "C0392B"
太字 = true

[送り先]
宛先 = "https://example.jp/uketsuke"
送り方 = "post"
ボタン = "申し込む"
